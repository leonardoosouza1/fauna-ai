[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-fauna"
version = "0.1.0"
description = "Laboratório de Evolução Neuro-Líquida: simulação de agentes autônomos com Redes Neurais Líquidas (CfC/NCP) em JAX/ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "jax[cpu]>=0.4.20",
    "flax>=0.8.0",
    "optax>=0.1.7",
    "chex>=0.1.8",
    "brax>=0.10.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "faiss-cpu>=1.7.4",
    "orbax-checkpoint>=0.5.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
